# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
# Bumped memory for intensive R8 optimization passes
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

android.compileSdkVersion=36
android.targetSdkVersion=36
android.buildToolsVersion=36.0.0
android.minSdkVersion=24
kotlinVersion=2.3.10

org.gradle.parallel=true
android.useAndroidX=true

# Code & Resource Optimization
android.enablePngCrunchInReleaseBuilds=true
android.enableMinifyInReleaseBuilds=true
android.enableShrinkResourcesInReleaseBuilds=true
android.enableBundleCompression=true

# Target 32-bit & 64-bit ARM for Android 10+ devices (~35 MB)
reactNativeArchitectures=armeabi-v7a,arm64-v8a

# Architecture & Engine
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Fresco features
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Network inspector disabled in production
EX_DEV_CLIENT_NETWORK_INSPECTOR=false

# CRITICAL: Enable legacy packaging to compress .so native libraries inside the APK
expo.useLegacyPackaging=true

# Packaging Exclusions
android.packagingOptions.excludes=META-INF/DEPENDENCIES,META-INF/LICENSE,META-INF/LICENSE.txt,META-INF/license.txt,META-INF/NOTICE,META-INF/NOTICE.txt,META-INF/notice.txt,META-INF/ASL2.0,META-INF/*.kotlin_module,META-INF/*.version,META-INF/INDEX.LIST

expo.inlineModules.watchedDirectories=[]
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
kotlin.compiler.execution.strategy=in-process
